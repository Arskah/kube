apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-block-metrics
  namespace: forge
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: forge
  hostnames:
    - forge.aarnihalinen.fi
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /not-found
      backendRefs:
        - name: forgejo-http
          port: 3000
