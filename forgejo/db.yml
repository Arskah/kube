apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-db
  namespace: forge
spec:
  serviceName: forgejo-db
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-db
  template:
    metadata:
      labels:
        app: forgejo-db
    spec:
      containers:
        - name: postgres
          image: postgres:17.12@sha256:dbb9623d5121b5d2c2c9e2fba56e40193cbb3510d4af7f035b1ab1823aff3205
          env:
            - name: POSTGRES_USER
              value: forgejo
            - name: POSTGRES_DB
              value: forgejo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          # Ahead of CI and the pods without requests when kube-node1 is short of CPU; a database
          # starved of it misses its readiness probe and drops out of the Service
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "forgejo", "-d", "forgejo"]
            initialDelaySeconds: 10
            periodSeconds: 10
            # The default of 1s is too short on the busy node: a timed out probe takes the only
            # database pod out of the Service, and Forgejo gets "connection refused"
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-db
  namespace: forge
spec:
  ports:
    - port: 5432
      name: postgres
  selector:
    app: forgejo-db
