apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-robots
  namespace: forge
data:
  robots.txt: |
    User-agent: GPTBot
    User-agent: ClaudeBot
    User-agent: CCBot
    User-agent: Google-Extended
    User-agent: Applebot-Extended
    User-agent: Bytespider
    User-agent: Amazonbot
    User-agent: meta-externalagent
    User-agent: PerplexityBot
    Disallow: /

    User-agent: *
    Disallow: /api/
    Disallow: /v2/
    Disallow: /-/
    Disallow: /user/
    Disallow: /explore/
    Disallow: /*/*/commit/
    Disallow: /*/*/commits/
    Disallow: /*/*/src/commit/
    Disallow: /*/*/blame/
    Disallow: /*/*/raw/
    Disallow: /*/*/media/
    Disallow: /*/*/archive/
    Disallow: /*/*/compare/
    Disallow: /*/*/graph
    Disallow: /*/*/activity
    Disallow: /*/*/search
    Disallow: /*/*/releases/download/
    Disallow: /*/*/issues?
    Disallow: /*/*/pulls?
