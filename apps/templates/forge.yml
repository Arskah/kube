apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: forge
    server: https://kubernetes.default.svc
  project: applications
  sources:
    - repoURL: https://github.com/Arskah/kube.git
      targetRevision: HEAD
      path: forgejo
    - repoURL: code.forgejo.org/forgejo-helm
      targetRevision: 17.1.5
      chart: forgejo
      helm:
        releaseName: forgejo
        valuesObject:
          ingress:
            enabled: false
          httpRoute:
            enabled: true
            hostnames:
              - "forge.aarnihalinen.fi"
            parentRefs:
              - name: public
                namespace: gateway
                sectionName: forge
            matches:
              path:
                type: PathPrefix
                value: /
              # Container image layers and large git pushes take longer than the default request timeout
              timeouts:
                request: 0s
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31536000; includeSubDomains
          # SSH does not go through the Gateway: Cilium does not support TCP listeners in host network
          # mode. The router forwards public port 2222 to this NodePort on kube-control instead.
          service:
            ssh:
              type: NodePort
              nodePort: 32222
          extraVolumes:
            - name: robots
              configMap:
                name: forgejo-robots
          extraContainerVolumeMounts:
            - name: robots
              mountPath: /data/gitea/public/robots.txt
              subPath: robots.txt
              readOnly: true
          persistence:
            enabled: true
            storageClass: "nfs-retain"
            size: 50Gi
          gitea:
            admin:
              username: arska
              passwordMode: initialOnlyNoReset
            config:
              actions:
                ENABLED: true
              service:
                DISABLE_REGISTRATION: true
                REQUIRE_SIGNIN_VIEW: false
              repository:
                DEFAULT_PRIVATE: private
              database:
                DB_TYPE: postgres
                HOST: forgejo-db.forge.svc.cluster.local:5432
                NAME: forgejo
                USER: forgejo
              server:
                # Explicit: the chart merges into the existing app.ini, so removing a key keeps its old value
                DISABLE_SSH: false
                SSH_PORT: 2222
                DOMAIN: forge.aarnihalinen.fi
                ROOT_URL: https://forge.aarnihalinen.fi/
                SSH_DOMAIN: forge.aarnihalinen.fi
              mailer:
                ENABLED: true
                PROTOCOL: smtp+starttls
                SMTP_ADDR: smtp.protonmail.ch
                SMTP_PORT: 587
                FROM: kube@aarnihalinen.fi
                USER: kube@aarnihalinen.fi
            additionalConfigFromEnvs:
              - name: FORGEJO__database__PASSWD
                valueFrom:
                  secretKeyRef:
                    name: forgejo-postgres-secret
                    key: postgres-password
              - name: FORGEJO__mailer__PASSWD
                valueFrom:
                  secretKeyRef:
                    name: forgejo-smtp
                    key: password
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
                additionalLabels:
                  release: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
