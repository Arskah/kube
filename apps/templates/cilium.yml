apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: infra
  source:
    repoURL: https://helm.cilium.io
    targetRevision: 1.20.2
    chart: cilium
    helm:
      releaseName: cilium
      version: v3
      valuesObject:
        ipam:
          mode: kubernetes
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              # - SYS_MODULE # Needs to be dropper per Talos docs
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              # - SYS_MODULE # Needs to be dropper per Talos docs
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        k8sServiceHost: localhost
        k8sServicePort: 7445
        kubeProxyReplacement: true
        # k8sServiceHost: 192.168.86.73
        # k8sServicePort: 6443
        operator:
          replicas: 1
          rollOutPods: true
        hubble:
          relay:
            enabled: true
          ui:
            enabled: true
        gatewayAPI:
          enabled: true
          # Offer HTTP/2 to clients
          enableAlpn: true
          gatewayClass:
            create: "true"
          # Listen directly on the nodes instead of through a LoadBalancer Service. The router
          # can only forward to a fixed port on a node, and the NodePorts of the generated
          # Service cannot be pinned.
          hostNetwork:
            enabled: true
        envoy:
          # Restart when the configuration changes
          rollOutPods: true
          securityContext:
            capabilities:
              # Needed for the host network Gateway listeners on ports 80 and 443
              keepCapNetBindService: true
              envoy:
                - NET_ADMIN
                - SYS_ADMIN
                - NET_BIND_SERVICE
        # Restart the agents and the operator when the configuration changes. Without this a
        # changed value only takes effect after restarting the pods by hand.
        rollOutCiliumPods: true
        l2announcements:
          enabled: true
        devices: eth0
        externalIPs:
          enabled: true
        externalTrafficPolicy: Cluster
        internalTrafficPolicy: Cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
