apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: infra
  source:
    repoURL: https://helm.cilium.io
    targetRevision: 1.20.4
    chart: cilium
    helm:
      releaseName: cilium
      version: v3
      valuesObject:
        ipam:
          mode: kubernetes
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              # - SYS_MODULE # Needs to be dropper per Talos docs
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              # - SYS_MODULE # Needs to be dropper per Talos docs
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        k8sServiceHost: localhost
        k8sServicePort: 7445
        kubeProxyReplacement: true
        # k8sServiceHost: 192.168.86.73
        # k8sServicePort: 6443
        # Requests put the agent, Envoy (the public Gateway) and the operator ahead of the pods
        # without requests when CPU is short. No memory limit on the agent and Envoy: an agent
        # killed for memory takes the network of its node down, and Envoy the public sites.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        operator:
          replicas: 1
          rollOutPods: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          prometheus:
            serviceMonitor:
              enabled: true
              labels:
                release: monitoring
        hubble:
          relay:
            enabled: true
          ui:
            enabled: true
          # Envoy reports every request through the Gateway as an L7 flow, with the request headers.
          # Redact unnecessary stuff
          redact:
            enabled: true
            http:
              urlQuery: true
              userInfo: true
              headers:
                allow:
                  - User-Agent
                  - Referer
          export:
            static:
              enabled: true
              filePath: /var/run/cilium/hubble/events.log
              allowList:
                - '{"event_type":[{"type":129}],"source_label":["reserved:ingress"]}'
                - '{"event_type":[{"type":129}],"destination_label":["reserved:ingress"]}'
              fieldMask:
                - time
                - IP
                - l7
                - source.namespace
                - destination.namespace
                - node_name
              fileMaxSizeMb: 10
              fileMaxBackups: 5
        gatewayAPI:
          enabled: true
          # Offer HTTP/2 to clients
          enableAlpn: true
          gatewayClass:
            create: "true"
          # Listen directly on the nodes instead of through a LoadBalancer Service. The router
          # can only forward to a fixed port on a node, and the NodePorts of the generated
          # Service cannot be pinned.
          hostNetwork:
            enabled: true
        envoy:
          # Restart when the configuration changes
          rollOutPods: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          prometheus:
            serviceMonitor:
              enabled: true
              labels:
                release: monitoring
          securityContext:
            capabilities:
              # Needed for the host network Gateway listeners on ports 80 and 443
              keepCapNetBindService: true
              envoy:
                - NET_ADMIN
                - SYS_ADMIN
                - NET_BIND_SERVICE
        # Metrics of the agents, the operator and Envoy for the Prometheus of the monitoring application, which only
        # picks up monitors with the release label. The chart refuses to render a ServiceMonitor when the CRD is
        # missing, so the manual install in talos/README.md switches the three monitors off.
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
            labels:
              release: monitoring
        # Restart the agents and the operator when the configuration changes. Without this a
        # changed value only takes effect after restarting the pods by hand.
        rollOutCiliumPods: true
        l2announcements:
          enabled: true
        devices: eth0
        externalIPs:
          enabled: true
        externalTrafficPolicy: Cluster
        internalTrafficPolicy: Cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
