apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  destination:
    namespace: docker-registry
    server: https://kubernetes.default.svc
  project: infra
  sources:
    - repoURL: https://github.com/Arskah/kube.git
      path: docker-registry
      targetRevision: HEAD
    - repoURL: https://twuni.github.io/docker-registry.helm
      targetRevision: 3.0.0
      chart: docker-registry
      helm:
        releaseName: docker-registry
        version: v3
        valuesObject:
          persistence:
            enabled: true
            size: 10Gi
            deleteEnabled: true
            existingClaim: docker-registry-pv-claim
          # htpasswd comes from the registry-htpasswd SealedSecret instead of the chart's own
          # `secrets.htpasswd`, which would put the hash in git
          extraVolumes:
            - name: htpasswd
              secret:
                secretName: registry-htpasswd
          extraVolumeMounts:
            - name: htpasswd
              mountPath: /auth
              readOnly: true
          extraEnvVars:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Registry Realm
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
