apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  destination:
    namespace: docker-registry
    server: https://kubernetes.default.svc
  project: infra
  sources:
    - repoURL: https://github.com/Arskah/kube.git
      path: docker-registry
      targetRevision: HEAD
    - repoURL: https://twuni.github.io/docker-registry.helm
      targetRevision: 3.0.0
      chart: docker-registry
      helm:
        releaseName: docker-registry
        version: v3
        valuesObject:
          persistence:
            enabled: true
            size: 10Gi
            deleteEnabled: true
            existingClaim: docker-registry-pv-claim
          # htpasswd comes from the registry-htpasswd SealedSecret instead of the chart's own
          # `secrets.htpasswd`, which would put the hash in git
          extraVolumes:
            - name: htpasswd
              secret:
                secretName: registry-htpasswd
          extraVolumeMounts:
            - name: htpasswd
              mountPath: /auth
              readOnly: true
          extraEnvVars:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Registry Realm
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            # Registry 3 exports OpenTelemetry traces to localhost:4318 by default. Nothing listens there, so
            # it logged an error every few seconds.
            - name: OTEL_TRACES_EXPORTER
              value: none
  # The chart generates a random `haSharedSecret` on every render and puts a checksum of the Secret on the pod
  # template, so every time ArgoCD rendered the chart again (cache expiry, repo-server restart) the registry was
  # rolled. Setting `secrets.haSharedSecret` would put the value in git; keep whatever is live instead.
  ignoreDifferences:
    - kind: Secret
      name: docker-registry-secret
      jsonPointers:
        - /data/haSharedSecret
    - group: apps
      kind: Deployment
      name: docker-registry
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      # Without this a sync would still apply the freshly rendered values of the ignored fields
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
