apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: infra
  source:
    # The chart is taken from the git tag instead of the upstream Helm repository, which is an index file on the
    # master branch pointing at tarballs on the master branch. At a release tag, charts/latest is the chart of that
    # release.
    repoURL: https://github.com/kubernetes-csi/csi-driver-nfs.git
    targetRevision: v4.13.4
    path: charts/latest/csi-driver-nfs
    helm:
      releaseName: csi-driver-nfs
      version: v3
      valuesObject:
        externalSnapshotter:
          enabled: true
        controller:
          runOnControlPlane: true
          replicas: 1
        storageClasses:
          - name: nfs-retain
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            parameters:
              server: 192.168.86.87
              share: /k8s
            reclaimPolicy: Retain
            volumeBindingMode: Immediate
            mountOptions:
              - nfsvers=4.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
