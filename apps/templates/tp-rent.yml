apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toiletpaper.rent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    namespace: tp-rent
    server: https://kubernetes.default.svc
  project: applications
  source:
    directory:
      recurse: true
      # Transitional: lets k8s/ gain a kustomization.yml before the switch to Kustomize
      exclude: kustomization.yml
    repoURL: https://forge.aarnihalinen.fi/arska/toiletpaper.rent.git
    targetRevision: main
    path: k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
