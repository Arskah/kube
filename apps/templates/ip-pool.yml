# Define an IP pool for Cilium to use for LoadBalancer IPs.
# The router hands out 192.168.86.20-192.168.86.99 over DHCP, so this range has to stay above that.
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: general-pool
spec:
  blocks:
    - start: "192.168.86.100"
      stop: "192.168.86.254"
---
# Define an L2 Announcement Policy named "policy1".
# This policy enables L2 announcements on eth0, the NIC name on the Talos nodes (net.ifnames=0).
# Only loadBalancerIPs are announced. externalIPs are left out, because ingress-nginx uses
# the control plane node IP as its externalIP and announcing it from another node would
# make two hosts answer ARP for the same address.
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: policy1
spec:
  interfaces:
    - eth0
  externalIPs: false
  loadBalancerIPs: true
