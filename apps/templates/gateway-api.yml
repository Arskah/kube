# Gateway API CRDs (standard channel).
# The version has to be one that the installed Cilium version supports, see
# https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/#prerequisites
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    server: https://kubernetes.default.svc
  project: infra
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd/standard
  syncPolicy:
    automated:
      # Pruning a CRD deletes every resource of that kind with it
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
