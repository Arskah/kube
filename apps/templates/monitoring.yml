apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: infra
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 92.3.0
    chart: kube-prometheus-stack
    helm:
      releaseName: monitoring
      version: v3
      skipCrds: false
      valuesObject:
        prometheusOperator:
          admissionWebhooks:
            certManager:
              enabled: true
            patch:
              enabled: false
        kubeProxy:
          enabled: false
        # Talos binds the controller manager and the scheduler to localhost, so they cannot be scraped and their
        # targets only produced alerts that were always firing.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        alertmanager:
          alertmanagerSpec:
            # Mounted at /etc/alertmanager/secrets/alertmanager-smtp
            secrets:
              - alertmanager-smtp
          config:
            global:
              smtp_smarthost: smtp.protonmail.ch:587
              smtp_from: kube@aarnihalinen.fi
              smtp_auth_username: kube@aarnihalinen.fi
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
            route:
              receiver: email
              routes:
                # Always firing by design, it only shows that the alerting pipeline is alive
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: kube@aarnihalinen.fi
                    send_resolved: true
        grafana:
          # Without a password of its own the chart generates a new one on every render, because ArgoCD renders
          # with `helm template`, which cannot look up the existing one. Every sync then restarted Grafana.
          admin:
            existingSecret: grafana-admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
