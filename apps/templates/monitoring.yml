apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: infra
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 92.2.0
    chart: kube-prometheus-stack
    helm:
      releaseName: monitoring
      version: v3
      skipCrds: false
      valuesObject:
        prometheusOperator:
          admissionWebhooks:
            certManager:
              enabled: true
            patch:
              enabled: false
        kubeProxy:
          enabled: false
        grafana:
          # Without a password of its own the chart generates a new one on every render, because ArgoCD renders
          # with `helm template`, which cannot look up the existing one. Every sync then restarted Grafana.
          admin:
            existingSecret: grafana-admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
