apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: letsencrypt@aarnihalinen.fi
    profile: tlsserver
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      # The challenge is served through the plain HTTP listener of the shared Gateway
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: gateway
                kind: Gateway
                sectionName: http
