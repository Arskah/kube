apiVersion: v1
kind: Service
metadata:
  name: jellyfin-external-service
  namespace: gateway
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8096
      targetPort: 8096
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jellyfin-external-service
  namespace: gateway
subsets:
  - addresses:
      - ip: 192.168.86.87
    ports:
      - name: http
        port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-route
  namespace: gateway
spec:
  parentRefs:
    - name: public
  hostnames:
    - "jellyfin.aarnihalinen.fi"
  rules:
    - matches:
        - headers:
            - name: X-Forwarded-Proto
              value: http
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin-external-service
          port: 8096
