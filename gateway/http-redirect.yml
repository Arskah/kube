# Redirect all plain HTTP requests to HTTPS. The ACME HTTP-01 challenge routes that cert-manager
# creates match an exact path and hostname, so they take precedence over this.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
