apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yml: |
    log:
      level: info
    runner:
      capacity: 2
      # Jobs that are still running on SIGTERM get this long to finish; keep it below the
      # terminationGracePeriodSeconds of the pod
      shutdown_timeout: 30m
      labels:
        - "ubuntu-latest:docker://node:22-bookworm"
      # Lets jobs build images on the Docker daemon of the pod
      envs:
        DOCKER_HOST: tcp://127.0.0.1:2376
        DOCKER_TLS_VERIFY: "1"
        DOCKER_CERT_PATH: /certs/client
    cache:
      # No workflow uses actions/cache; this saves a listener that jobs can reach
      enabled: false
    container:
      # The host network of the job containers is the network namespace of the rootless
      # daemon, which listens on 127.0.0.1:2376 there; it is not the network of the node.
      network: host
      # Paths on the daemon side, where the dind container has the certificates
      options: -v /certs/client:/certs/client:ro
      valid_volumes:
        - /certs/client
    server:
      connections:
        forgejo:
          # The job containers do not get the search domains of the pod, so the name has to be
          # fully qualified
          url: http://forgejo-http.forge.svc.cluster.local:3000
          # Written by scripts/seal-forgejo-runner-token.sh together with the sealed token
          uuid: 906acf47-fddd-4111-b0a3-9015e8f4a902
          token_url: file:$CREDENTIALS_DIRECTORY/token
  # Read by the rootless daemon from ~/.config/docker
  daemon.json: |
    {
      "builder": {
        "gc": {
          "enabled": true,
          "defaultKeepStorage": "4GB"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  # The runner is registered once; two pods with the same UUID would compete for jobs
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      automountServiceAccountToken: false
      # Above runner.shutdown_timeout, so that running jobs can finish
      terminationGracePeriodSeconds: 1860
      securityContext:
        # The rootless user of the dind image; makes the emptyDirs writable for it
        fsGroup: 1000
      initContainers:
        # Native sidecar: starts before the runner, which only starts once the daemon answers, and
        # stops after it.
        #
        # The daemon runs as UID 1000 inside rootlesskit, so root in a job container is UID 1000 on
        # the node. rootlesskit still needs a privileged container (an unprivileged one has parts of
        # /proc and /sys masked, which stops it from mounting them for the job containers), and user
        # namespaces enabled on the nodes (talos/patches/all.yaml).
        - name: dind
          image: docker:29.9.2-dind-rootless@sha256:ae083cc7de51e7a8e5a597f8fb774ca7914c408a95fc0f1477826a913479518a
          restartPolicy: Always
          securityContext:
            privileged: true
          env:
            # Generates a CA, a server and a client certificate on every start
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          startupProbe:
            exec:
              command:
                - docker
                - --host=tcp://localhost:2376
                - --tlsverify
                - --tlscacert=/certs/client/ca.pem
                - --tlscert=/certs/client/cert.pem
                - --tlskey=/certs/client/key.pem
                - info
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              # Low on purpose: under contention CPU goes by requests, and CI should only get what
              # Forgejo and the other services leave
              cpu: 100m
              memory: 1Gi
              # Without a request it would default to the limit, which kube-control does not have
              ephemeral-storage: 2Gi
            limits:
              # Leaves room for Forgejo and its database, which run on the same node
              cpu: 1500m
              memory: 4Gi
              # With a limit on every container, the kubelet also evicts the pod when the writable
              # layers and the emptyDirs together go over the sum of the limits. So each limit is
              # 1Gi for the container itself plus the emptyDirs it writes to: here the image store
              ephemeral-storage: 13Gi
          volumeMounts:
            - name: certs
              mountPath: /certs
            # One level above the data root: dockerd has to own its data root, and the emptyDir is
            # owned by root
            - name: docker
              mountPath: /home/rootless/.local/share
            - name: config
              mountPath: /home/rootless/.config/docker/daemon.json
              subPath: daemon.json
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
          workingDir: /data
          command:
            [
              "forgejo-runner",
              "daemon",
              "--config",
              "/etc/forgejo-runner/config.yml",
            ]
          env:
            - name: HOME
              value: /data
            - name: CREDENTIALS_DIRECTORY
              value: /run/secrets/forgejo-runner
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 100Mi
            limits:
              memory: 256Mi
              # 1Gi plus /data and /tmp, see the daemon
              ephemeral-storage: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
            - name: config
              mountPath: /etc/forgejo-runner/config.yml
              subPath: config.yml
            - name: token
              mountPath: /run/secrets/forgejo-runner
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: token
          secret:
            secretName: forgejo-runner-token
            items:
              - key: token
                path: token
        - name: certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # Images and build cache. Lost when the pod is recreated; above the limit the pod is
        # evicted, which empties it
        - name: docker
          emptyDir:
            sizeLimit: 12Gi
