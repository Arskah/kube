apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
    container:
      # Job containers resolve the public name to the node running the Gateway, because a
      # pod reaching the router's public address from inside the LAN may not work
      options: "--add-host=forge.aarnihalinen.fi:192.168.86.73"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo-runner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        # Registers once; the .runner file stays on the volume, so later starts skip this
        - name: register
          image: data.forgejo.org/forgejo/runner:13
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
          workingDir: /data
          command: ["sh", "-c"]
          args:
            - |
              [ -f /data/.runner ] && exit 0
              forgejo-runner register --no-interactive --config /config/config.yml \
                --instance http://forgejo-http.forge.svc.cluster.local:3000 \
                --token "$REGISTRATION_TOKEN" \
                --name k8s-poc \
                --labels ubuntu-latest:docker://node:22-bookworm
          env:
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-token
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
          workingDir: /data
          command:
            ["forgejo-runner", "daemon", "--config", "/config/config.yml"]
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          # Only reachable from inside the pod, no TLS needed
          command: ["dockerd", "-H", "tcp://127.0.0.1:2375", "--tls=false"]
          volumeMounts:
            - name: docker-graph
              mountPath: /var/lib/docker
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: docker-graph
          emptyDir: {}
