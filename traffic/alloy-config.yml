# The pipeline of Alloy (apps/templates/alloy.yml): tails the Hubble export of the Gateway flows
# on each node and ships them to Loki with labels for the host, the client type and the origin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    local.file_match "hubble" {
      path_targets = [{"__path__" = "/var/run/cilium/hubble/events.log"}]
    }

    loki.source.file "hubble" {
      targets       = local.file_match.hubble.targets
      forward_to    = [loki.process.gateway.receiver]
      tail_from_end = true
    }

    loki.process "gateway" {
      forward_to = [loki.write.loki.receiver]

      stage.json {
        expressions = {
          time       = "flow.time",
          type       = "flow.l7.type",
          url        = "flow.l7.http.url",
          source     = "flow.IP.source",
          destination = "flow.IP.destination",
          code       = "flow.l7.http.code",
          user_agent = "flow.l7.http.headers[?key=='User-Agent'].value | [0]",
          protocol   = "flow.l7.http.protocol",
          // Hubble redacts the values of the other headers, but keeps their names
          accept_language = "contains(flow.l7.http.headers[].key, 'Accept-Language')",
          sec_fetch       = "contains(flow.l7.http.headers[].key, 'Sec-Fetch-Mode')",
          upgrade         = "contains(flow.l7.http.headers[].key, 'Upgrade')",
        }
      }

      stage.timestamp {
        source = "time"
        format = "RFC3339Nano"
      }

      stage.regex {
        source     = "url"
        expression = "^[a-z]+://(?P<url_host>[^/:]+)(:[0-9]+)?(?P<path>[^?]*)"
      }

      // Port 80 accepts any Host header, so only the hostnames of the Gateway become label values
      stage.template {
        source   = "host"
        template = `{{ if regexMatch "^((sik75|jellyfin|icecast|forge|tp|www|staging|music)\\.)?aarnihalinen\\.fi$" .url_host }}{{ .url_host }}{{ else }}other{{ end }}`
      }

      stage.template {
        source   = "type"
        template = `{{ .type | lower }}`
      }

      stage.regex {
        source     = "user_agent"
        expression = "(Chrome|Firefox)/(?P<browser_version>[0-9]+)"
      }

      stage.regex {
        source     = "user_agent"
        expression = "Version/(?P<safari_version>[0-9]+)[.0-9]* (Mobile/[0-9A-Z]+ )?Safari/"
      }

      // Why a request looks like a bot, empty for a browser. Scanners send browser User-Agents, so
      // besides the names of crawlers and tools this checks what real browsers do: they have a
      // platform in the User-Agent, keep up to date, send Accept-Language, use HTTP/2 over TLS
      // (except for WebSockets), and Chrome and Firefox send Sec-Fetch-* to HTTPS sites (Safari's
      // support has been patchy). A contact URL ("+https://...") is how crawlers sign themselves.
      // Raise the version cutoffs (Chrome/Firefox 140 and Safari 17) about once a year.
      stage.template {
        source   = "bot_reason"
        template = `{{- if ne .type "request" -}}
          {{- else if not .user_agent -}} no-user-agent
          {{- else if regexMatch "(?i)bot|crawl|spider|slurp|scrapy|curl|wget|python|go-http|go-git|java/|okhttp|axios|node-fetch|headless|httpclient|libwww|facebookexternalhit|meta-external|bytespider|chatgpt-user|perplexity|anthropic-ai|cohere-ai|diffbot|omgili|scan|zgrab|masscan|nmap|nuclei|\\+https?://" .user_agent -}} known-bot
          {{- else if not (regexMatch "^Mozilla/5\\.0 \\((Windows|Macintosh|X11|Linux|iPhone|iPad|Android)" .user_agent) -}} not-a-browser
          {{- else if or (and .browser_version (lt (atoi .browser_version) 140)) (and .safari_version (lt (atoi .safari_version) 17)) -}} old-browser
          {{- else if ne .accept_language "true" -}} no-accept-language
          {{- else if and (hasPrefix "https://" .url) (ne .protocol "HTTP/2") (ne .upgrade "true") -}} http1
          {{- else if and (hasPrefix "https://" .url) .browser_version (ne .sec_fetch "true") -}} no-sec-fetch
          {{- end -}}`
      }

      stage.template {
        source   = "client"
        template = `{{ if eq .type "request" }}{{ if .bot_reason }}bot{{ else }}browser{{ end }}{{ end }}`
      }

      // The client is the source of a request and the destination of a response. Requests
      // from the LAN, and from the cluster itself through the router, come from the router.
      stage.template {
        source   = "client_ip"
        template = `{{ if eq .type "response" }}{{ .destination }}{{ else }}{{ .source }}{{ end }}`
      }

      stage.template {
        source   = "origin"
        template = `{{ if hasPrefix "192.168.86." .client_ip }}lan{{ else }}internet{{ end }}`
      }

      // Unbounded values go to structured metadata, which queries can group by without
      // making a stream for each value
      stage.structured_metadata {
        values = {
          client_ip  = "",
          user_agent = "",
          path       = "",
          code       = "",
          bot_reason = "",
        }
      }

      stage.labels {
        values = {
          host   = "",
          type   = "",
          client = "",
          origin = "",
        }
      }

      stage.label_drop {
        values = ["filename"]
      }

      stage.static_labels {
        values = {
          job = "gateway",
        }
      }
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
    }
