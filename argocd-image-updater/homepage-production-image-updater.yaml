apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homepage-production-image-updater
  namespace: argocd
spec:
  namespace: argocd
  writeBackConfig:
    method: "argocd"
  applicationRefs:
    - namePattern: "homepage-production"
      images:
        - alias: "production"
          imageName: "forge.aarnihalinen.fi/public/homepage:vx.x.x"
          manifestTargets:
            kustomize:
              name: homepage-image
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
