default_install_hook_types = ["pre-commit", "commit-msg"]

# The tools are called from node_modules directly, not with `pnpm exec`: prek
# stashes the unstaged changes while the hooks run, and pnpm would reinstall the
# dependencies if package.json differs from the lockfile in that state.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
entry = "node_modules/.bin/oxfmt --no-error-on-unmatched-pattern"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "node_modules/.bin/commitlint --edit"
language = "system"
stages = ["commit-msg"]
