apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: icecast
  namespace: icecast
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: icecast
  hostnames:
    - icecast.aarnihalinen.fi
  rules:
    - backendRefs:
        - name: icecast-svc
          port: 80
      # Streams stay open for as long as someone listens
      timeouts:
        request: 0s
---
# Allow the shared Gateway to terminate TLS with the certificate of this namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls
  namespace: icecast
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway
  to:
    - group: ""
      kind: Secret
      name: tls-secret
