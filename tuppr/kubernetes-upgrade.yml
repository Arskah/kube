# tuppr upgrades Kubernetes to exactly this version as soon as it changes. Before a new minor version: Cilium,
# ArgoCD and cert-manager have to support it, and Talos too (support matrix in the Talos documentation).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.36.5
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
