name: PR check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-pr-title:
    uses: ./.github/workflows/pr-title.yml

  lint:
    uses: ./.github/workflows/lint.yml

  kube-linter:
    uses: ./.github/workflows/kube-linter.yml

  kubeconform:
    uses: ./.github/workflows/kubeconform.yml
