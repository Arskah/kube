name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prek:
    name: prek
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      # The pre-commit hooks of prek.toml: oxfmt, shellcheck, actionlint and zizmor
      - name: prek
        run: prek run --all-files --show-diff-on-failure
