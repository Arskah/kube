# The installer is still configured through the v1alpha1 `machine.install`: the UnattendedInstallConfig document
# that replaces it has no field for kernel arguments.
machine:
  install:
    disk: /dev/sda
    # Image Factory schematic with the qemu-guest-agent extension
    image: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.14.2
    extraKernelArgs:
      # Keep the NIC named eth0, Cilium `devices` relies on it
      - net.ifnames=0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
$patch: delete
---
# `talosctl gen config` turns workload isolation on for new clusters. The nodes were upgraded from 1.11 and run
# without it, and it has not been tried here with Cilium, csi-driver-nfs and the in-tree NFS volumes.
apiVersion: v1alpha1
kind: SecurityProfileConfig
$patch: delete
