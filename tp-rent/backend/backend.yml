apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tp-rent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: forge.aarnihalinen.fi/public/tp-rent-backend:371876db4298381ae5753b7d02f9b8d6fa033a6c@sha256:90c0c13d31ce82816bcc2e88b64d5e340e1fe528ae25e9c66965996bb4a38c05
          env:
            - name: DATABASE_HOST
              value: db-svc.tp-rent.svc
            - name: DATABASE_DB
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: POSTGRES_DB
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8000
              name: http
