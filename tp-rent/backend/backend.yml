apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tp-rent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: forge.aarnihalinen.fi/public/tp-rent-backend:latest@sha256:896df8b479bd9a0a22b69411431a6e983c5c40e5b2440c2f5c21ec5fdca1ee2c
          env:
            - name: DATABASE_HOST
              value: db-svc.tp-rent.svc
            - name: DATABASE_DB
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: POSTGRES_DB
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8000
              name: http
          # securityContext:
          #   allowPrivilegeEscalation: false
