apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tp-rent
  namespace: tp-rent
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: tp
  hostnames:
    - tp.aarnihalinen.fi
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend-svc
          port: 80
    - backendRefs:
        - name: frontend-svc
          port: 80
---
# Allow the shared Gateway to terminate TLS with the certificate of this namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls
  namespace: tp-rent
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway
  to:
    - group: ""
      kind: Secret
      name: tls-secret
