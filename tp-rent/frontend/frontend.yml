apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tp-rent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: forge.aarnihalinen.fi/public/tp-rent-frontend:371876db4298381ae5753b7d02f9b8d6fa033a6c@sha256:26880f23b840b431f03289f8036a1b5996e50bdc0fd0f9a956d489b649a38d51
          ports:
            - containerPort: 8080
              name: http
